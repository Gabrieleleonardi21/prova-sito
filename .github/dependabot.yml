# Aggiornamento automatico delle dipendenze: Dependabot apre le PR e la CI
# le valida coi test — si fa merge solo se è tutto verde.
version: 2
updates:
  # Pacchetti npm: aggiornamenti minor/patch raggruppati in una sola PR
  # settimanale per ridurre il rumore; i major restano PR separate.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-e-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 (compilatore nativo) non è ancora supportato da
      # typescript-eslint: npm ci si blocca sul conflitto di peer dependency.
      # Togliere questa riga quando typescript-eslint dichiara il supporto.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # Le action dei workflow (checkout, setup-node, deploy-pages…)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
