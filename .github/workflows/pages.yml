# Deploy su GitHub Pages a ogni push su main — MA solo se lint, build e
# test end-to-end passano: un commit che rompe il checkout non va online.
# (La CI separata copre branch e pull request; qui su main si valida tutto
# prima di pubblicare, senza doppioni.)
#
# Il sito viene servito da https://<utente>.github.io/<repo>/ : per questo la
# build riceve VITE_BASE=/<repo>/ (percorsi di asset, router e link assoluti).
# Quando si passerà al dominio proprio (gioielleriasaltini.com via CNAME),
# togliere la variabile VITE_BASE qui sotto: il base torna "/".
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # I test usano il Chrome preinstallato sul runner (channel "chrome")
      - run: npm run test:e2e
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # Pages è già abilitato sul repo (build_type: workflow); l'auto-abilitazione
      # (enablement: true) è stata tolta perché soffre di un bug su Node 24.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
