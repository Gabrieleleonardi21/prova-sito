# CI su branch di lavoro e pull request: lint, build (con generazione SEO)
# e test end-to-end del flusso di acquisto.
# Su main la stessa validazione avviene dentro il workflow di deploy
# (pages.yml), che pubblica solo se tutto è verde: qui main è escluso
# per non eseguire i controlli due volte.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: lo script SEO importa i .ts del progetto via type stripping
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # I test usano il Chrome preinstallato sul runner (channel "chrome")
      - run: npm run test:e2e
