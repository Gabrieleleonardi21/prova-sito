# CI su ogni push e pull request: lint, build (con generazione SEO) e test
# end-to-end (flussi di acquisto + scansioni accessibilità axe).
#
# Nota deploy: l'hosting è Vercel via integrazione Git (il repo è privato,
# GitHub Pages non era più utilizzabile). Vercel builda a ogni push su main
# in modo indipendente da questa CI: la build include il type-check (tsc),
# ma i test girano solo qui — un rosso su main va guardato subito.
name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24: lo script SEO importa i .ts del progetto via type stripping
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # I test usano il Chrome preinstallato sul runner (channel "chrome")
      - run: npm run test:e2e
